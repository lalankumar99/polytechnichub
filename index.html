<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PolyHub">
    
    <title>POLYTECHNIC HUB — Digital Study Library</title>
    <meta name="description" content="Organized Notes, PDFs and Study Materials for Polytechnic Engineering Students." />
    <meta property="og:title" content="POLYTECHNIC HUB — Digital Study Library" />
    <meta property="og:description" content="Organized Notes, PDFs and Study Materials — All in One Place." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    
    <style>
      #pwa-install-btn {
        display: none;
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        background: #2563eb;
        color: #ffffff;
        border: none;
        padding: 10px 18px;
        border-radius: 50px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      }
    </style>
  </head>
  <body class="bg-slate-50 font-sans antialiased text-slate-900">
    <div id="root"></div>

    <!-- PWA Install Button -->
    <button id="pwa-install-btn">Install App</button>

    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Install Logic -->
    <script>
      let deferredPrompt;
      const installBtn = document.getElementById('pwa-install-btn');

      // Install prompt capture karna
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.style.display = 'block';
      });

      // Button click par prompt dikhana
      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            installBtn.style.display = 'none';
          }
        });
      }

      // App install hone ke baad button gayab karna
      window.addEventListener('appinstalled', () => {
        if (installBtn) installBtn.style.display = 'none';
        deferredPrompt = null;
      });
    </script>
  </body>
  </html>
